<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Otobüs Yoğunluğu</title>
</head>
<body>
    <h1>Otobüs Yoğunluğu Takibi</h1>

    <p id="bus-density">Yükleniyor...</p>

    <script>
        async function updateBusData() {
            try {
                const response = await fetch("https://bus-density-api.onrender.com/bus/42");
                const data = await response.json();
                document.getElementById("bus-density").innerText = `Yolcu Sayısı: ${data.count}`;
            } catch (error) {
                document.getElementById("bus-density").innerText = "API’ye ulaşılamıyor.";
                console.error(error);
            }
        }

        // 5 saniyede bir güncelle
        setInterval(updateBusData, 5000);
        updateBusData();
    </script>
</body>
</html>
