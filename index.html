<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Otobüs Yoğunluk Paneli</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 30px;
}

h1 {
    color: #38bdf8;
}

.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

/* CARD */
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    margin-top: 20px;
}

/* BAR */
.bar-container {
    width: 100%;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
}

.bar {
    height: 20px;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
    transition: width 0.5s ease;
}

.count {
    font-size: 40px;
    margin: 10px;
}

.status {
    font-size: 14px;
    margin-top: 5px;
}
</style>
</head>

<body>

<h1>🚌 Otobüs Yoğunluk Sistemi</h1>

<div class="container" id="container"></div>

<script>

const buses = [42, 43, 44];

// 🔥 her otobüs için veri saklama
let state = {};

buses.forEach(bus => {
    state[bus] = {
        lastUpdate: 0,
        count: 0,
        history: []
    };
});

// kartları oluştur
const container = document.getElementById("container");

buses.forEach(bus => {
    container.innerHTML += `
    <div class="card">
        <h2>Otobüs ${bus}</h2>
        <div id="count-${bus}" class="count">--</div>

        <div class="bar-container">
            <div id="bar-${bus}" class="bar"></div>
        </div>

        <p id="status-${bus}" class="status">Bekleniyor...</p>

        <canvas id="chart-${bus}"></canvas>
    </div>
    `;
});

// chartlar
let charts = {};

buses.forEach(bus => {
    const ctx = document.getElementById(`chart-${bus}`);

    charts[bus] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Yolcu',
                data: [],
                borderColor: '#38bdf8',
                tension: 0.4
            }]
        }
    });
});

// 🔥 ANA UPDATE
async function update() {

    for (let bus of buses) {

        try {
            const res = await fetch(`https://bus-density-backend.onrender.com/bus/${bus}`);
            const data = await res.json();

            state[bus].count = data.count;
            state[bus].lastUpdate = Date.now();

        } catch (e) {
            console.log("API hata", bus);
        }

        // 🔥 10 saniye kuralı
        if (Date.now() - state[bus].lastUpdate > 10000) {
            state[bus].count = 0;
        }

        let count = state[bus].count;

        // UI update
        document.getElementById(`count-${bus}`).innerText = count;

        // bar
        let percent = Math.min((count / 50) * 100, 100);
        document.getElementById(`bar-${bus}`).style.width = percent + "%";

        // status
        let statusText = "Canlı";
        if (count === 0) statusText = "Boş";
        document.getElementById(`status-${bus}`).innerText = statusText;

        // chart
        let time = new Date().toLocaleTimeString();

        charts[bus].data.labels.push(time);
        charts[bus].data.datasets[0].data.push(count);

        if (charts[bus].data.labels.length > 10) {
            charts[bus].data.labels.shift();
            charts[bus].data.datasets[0].data.shift();
        }

        charts[bus].update();
    }
}

setInterval(update, 3000);
update();

</script>

</body>
</html>
