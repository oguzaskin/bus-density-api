<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Otobüs Yoğunluk Paneli</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    margin: 0;
}

/* HEADER */
h1 {
    color: #38bdf8;
    padding: 20px;
}

/* GRID */
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

/* CARD */
.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 15px;
    width: 250px;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* FULLSCREEN MODE */
.fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0f172a;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
}

.fullscreen .card {
    width: 80%;
    height: 80%;
    font-size: 24px;
}

/* SAYI */
.count {
    font-size: 40px;
    margin: 10px;
}

/* BAR */
.bar-container {
    width: 100%;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 20px;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
    transition: 0.5s;
}
.focus-mode .card {
    display: none;
}

.focus-mode .card.active {
    display: block;
    width: 400px;
    margin: 50px auto;
}
</style>
</head>

<body>

<h1>🚌 Otobüs Yoğunluk Sistemi</h1>

<div id="container" class="container"></div>

<script>

const buses = [42, 43, 44];

let state = {};
let charts = {};
let activeBus = null;

const container = document.getElementById("container");

/* -------------------------
   KARTLARI OLUŞTUR
--------------------------*/
buses.forEach(bus => {

    state[bus] = {
        count: 0
    };

    container.innerHTML += `
    <div class="card" id="card-${bus}" onclick="openFull(${bus})">
        <h2>Otobüs ${bus}</h2>
        <div class="count" id="count-${bus}">--</div>

        <div class="bar-container">
            <div class="bar" id="bar-${bus}"></div>
        </div>

        <p id="status-${bus}">Bekleniyor</p>

        <canvas id="chart-${bus}"></canvas>
    </div>
    `;
});

/* -------------------------
   CHART
--------------------------*/
buses.forEach(bus => {
    const ctx = document.getElementById(`chart-${bus}`);

    charts[bus] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Yolcu',
                data: [],
                borderColor: '#38bdf8'
            }]
        }
    });
});

/* -------------------------
   FULLSCREEN AÇ
--------------------------*/

function openFull(bus) {

    const container = document.getElementById("container");

    // tüm kartları gizle
    container.classList.add("focus-mode");

    // sadece seçilen kartı göster
    document.querySelectorAll(".card").forEach(c => {
        c.classList.remove("active");
    });

    document.getElementById(`card-${bus}`).classList.add("active");
}

/* -------------------------
   FULLSCREEN KAPAT
--------------------------*/
function closeFull() {
    if (activeBus) {

        const card = document.getElementById(`card-${activeBus}`);
        card.classList.remove("fullscreen");

        setTimeout(() => {
            charts[activeBus].resize();
            charts[activeBus].update();
        }, 300);

        activeBus = null;
    }
}

/* ESC */
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        document.getElementById("container").classList.remove("focus-mode");

        document.querySelectorAll(".card").forEach(c => {
            c.classList.remove("active");
        });
    }
});

/* -------------------------
   UPDATE
--------------------------*/
async function update() {

    for (let bus of buses) {

        try {
            const res = await fetch(`https://bus-density-backend.onrender.com/bus/${bus}`);
            const data = await res.json();

            state[bus].count = data.count;

        } catch (e) {}

        let count = state[bus].count;

        document.getElementById(`count-${bus}`).innerText = count;

        let percent = Math.min((count / 50) * 100, 100);
        document.getElementById(`bar-${bus}`).style.width = percent + "%";

        document.getElementById(`status-${bus}`).innerText =
            count === 0 ? "BOŞ" : "CANLI";

        let time = new Date().toLocaleTimeString();

        charts[bus].data.labels.push(time);
        charts[bus].data.datasets[0].data.push(count);

        if (charts[bus].data.labels.length > 10) {
            charts[bus].data.labels.shift();
            charts[bus].data.datasets[0].data.shift();
        }

        charts[bus].update();
    }
}

setInterval(update, 3000);
update();

</script>

</body>
</html>
