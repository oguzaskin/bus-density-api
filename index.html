<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Otobüs Yoğunluğu</title>
</head>
<body>

<h1>Otobüs Yoğunluğu</h1>
<p id="result">Yükleniyor...</p>

<script>
async function getData() {
    try {
        const res = await fetch("https://bus-density-backend.onrender.com/bus/42");
        const data = await res.json();
        document.getElementById("result").innerText = "Yolcu Sayısı: " + data.count;
    } catch (e) {
        document.getElementById("result").innerText = "API’ye ulaşılamıyor";
        console.error(e);
    }
}

setInterval(getData, 5000);
getData();
</script>

</body>
</html>
